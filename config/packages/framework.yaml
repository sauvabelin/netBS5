# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: false

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    #esi: true
    #fragments: true
    php_errors:
        log: true

    # `timeout` is the inactivity timeout, `max_duration` the total budget, so
    # a stalled upstream never wedges a worker.
    http_client:
        scoped_clients:
            hydra.admin.client:
                base_uri: '%env(HYDRA_ADMIN_URL)%'
                timeout: 5
                max_duration: 10
            lldap.client:
                base_uri: '%env(LLDAP_URL)%'
                timeout: 5
                max_duration: 15

    rate_limiter:
        password_reset_request:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
        password_reset_user:
            policy: 'sliding_window'
            limit: 3
            interval: '1 hour'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        rate_limiter:
            password_reset_request:
                policy: 'no_limit'
            password_reset_user:
                policy: 'no_limit'