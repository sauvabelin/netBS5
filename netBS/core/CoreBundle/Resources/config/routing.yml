net_bs_secure:
    resource: "@NetBSSecureBundle/Controller/"
    type:     attribute
    prefix:   /secure

net_bs_fichier:
    resource: "@NetBSFichierBundle/Controller/"
    type:     attribute
    prefix:   /fichier

net_bs_core:
    resource: "@NetBSCoreBundle/Controller/"
    type:     attribute
    prefix:   /

home:
    path: /
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
    defaults:
        path: /netBS
        permanent: true
